; Treadmill display for Freenove ESP32-S3 5.0" IPS (FNK0115Q).
; Arduino core 3.2.0 (pioarduino 54.03.20) — the version Freenove tests its examples with.

[platformio]
default_envs = freenove_s3_5in

[env:freenove_s3_5in]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM-1-N16R8: 16 MB QIO flash + 8 MB OPI PSRAM
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

; Rebuilt Arduino core (pioarduino "hybrid compile"). Code and read-only data
; run from PSRAM, so a flash write (walk log, day log) no longer switches off
; the cache, and the panel's interrupts keep refilling the screen from the
; frame buffer in PSRAM meanwhile (display.cpp). GDMA control functions, which
; those interrupts call, go to IRAM. The first build downloads ESP-IDF and
; recompiles the core; later builds are normal. The recompile starts from the
; core's generic config, so the lines after the first four restore what the
; stock core has for this board (memory type qio_opi); the ESP32_WIFI_* lines
; are old names of the same options that the generic config still lists.
custom_sdkconfig =
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
    CONFIG_SPIRAM_RODATA=y
    CONFIG_GDMA_CTRL_FUNC_IN_IRAM=y
    CONFIG_SPIRAM_MODE_OCT=y
    '# CONFIG_SPIRAM_MODE_QUAD is not set'
    CONFIG_SPIRAM_BOOT_INIT=y
    CONFIG_SPIRAM_IGNORE_NOTFOUND=y
    '# CONFIG_SPIRAM_MEMTEST is not set'
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER=y
    '# CONFIG_ESP_WIFI_STATIC_TX_BUFFER is not set'
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=32
    CONFIG_ESP_WIFI_RX_BA_WIN=6
    CONFIG_LWIP_TCP_OOSEQ_MAX_PBUFS=4
    '# CONFIG_ESP32_WIFI_STATIC_TX_BUFFER is not set'
    CONFIG_ESP32_WIFI_RX_BA_WIN=6
; ESP Insights and RainMaker embed TLS certificates that pioarduino 54.03.20
; cannot build in the recompile, so they go out with their helper components
; (the same list as pioarduino's own example); the firmware uses none of them.
; LittleFS (the walk logs) stays at the stock core's version, not the newest.
custom_component_remove =
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/esp_rainmaker
    espressif/rmaker_common
    joltwallet/littlefs
custom_component_add =
    joltwallet/littlefs@1.19.1
; pioarduino leaves the recompiled core's linker script in the build folder only
extra_scripts = pre:tools/core_sections_ld.py

; Board uses a CH340 USB-UART bridge, not native USB CDC
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Wall
    ${lvgl.build_flags}
    ; display.cpp holds the panel's interrupts off while the cache is off
    -Wl,--wrap=spi_flash_disable_interrupts_caches_and_other_cpu
    -Wl,--wrap=spi_flash_enable_interrupts_caches_and_other_cpu
; src/sim/ is the computer-side renderer (env:sim), not firmware
build_src_filter = +<*> -<sim/>

lib_deps =
    moononournation/GFX Library for Arduino@1.6.5
    h2zero/NimBLE-Arduino@^2.3.0
    ${lvgl.lib_deps}

; The same firmware, but the screen cycles through scenes with made-up values,
; for checking the layout on the real panel.
[env:freenove_s3_5in_demo]
extends = env:freenove_s3_5in
build_flags =
    ${env:freenove_s3_5in.build_flags}
    -DUI_DEMO

; Renders the screen on the computer into BMP files, no board needed:
;   pio run -e sim && .pio/build/sim/program <out dir>
[env:sim]
platform = native
build_src_filter = -<*> +<sim/>
build_flags = ${lvgl.build_flags}
extra_scripts = pre:tools/cxx17.py
lib_deps = ${lvgl.lib_deps}
test_ignore = *

; Graphics library and its config (include/lv_conf.h), shared by board and sim
[lvgl]
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
lib_deps = lvgl/lvgl@9.5.0

; Host-side unit tests for the pure C++ logic in lib/ (no board needed)
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
